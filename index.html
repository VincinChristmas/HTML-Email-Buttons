<!--THE TABLE METHOD OF BUILDING AN EMAIL BUTTON-->

<!--KEY NOTES:
a button always gets its own table
outlook will ignore border-radius, this is fine
always write the lable as real text rather than an image. Images will be ignored sometimes


-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rove &amp; Co.</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff;">
          <tr>
            <td align="center" style="padding:32px; text-align:center; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; color:#1b1f24;">
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#6b7280;">The winter range lands on Thursday.</p>

              <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#15a862" style="background-color:#15a862;border-radius:6px;">
                    <a href="https://example.com/winter" style="display:block; padding:14px 28px; display:block; color:#ffffff; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif, font-size:15px; line-height:1; font-weight:bold; text-decoration:none;">See the winter range</a>

                  </td>
                </tr>

              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

<!--THE PADDING METHOD OF BUILDING EMAIL BUTTONS-->

<!--The padding method builds a button out of one anchor tag. No table, no cell, just a link with a background and some padding.

This method often breaks in outlook.

In this method, the background sits on the link itself rather than the cell.

Use mso-padding-alt:0 at the start of the style attribute on the link.This should be paired wif a VML fallback. 
-->


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rove &amp; Co.</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff;">
          <tr>
            <td align="center" style="padding:32px; text-align:center; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; color:#1b1f24;">
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#6b7280;">The winter range lands on Thursday.</p>

              <a href="https://example.com/winter" style="mso-padding-alt:0; display:inline-block; padding:14px 28px; background-color:#15a862; color: #ffffff; border-radius:6px font-family:Arial, 'Helvetica Neue',Helvetica, san-serif; font-size:15px; font-weight:bold; text-decoration:none;" >See the winter range</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
